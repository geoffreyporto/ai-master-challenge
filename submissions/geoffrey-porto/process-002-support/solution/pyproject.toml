[project]
name = "support-redesign"
version = "1.0.0"
description = "Redesign de Suporte — G4 AI Master Challenge 002"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "polars>=1.40",
    "numpy>=2.3",
    "scipy>=1.16",
    "scikit-learn>=1.9",
    "statsmodels>=0.14.5",
    "model2vec>=0.9",
    "pyyaml>=6.0",
    "plotly>=6.0",
    "streamlit>=1.60",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "playwright>=1.55",
    "pytest>=8.4",
    "pytest-playwright>=0.7",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_redesign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["I", "F", "E", "W", "PL", "PT", "B", "UP", "S"]
ignore = ["PLR2004", "PLR0913", "PLR0911", "PLR0915", "PLC0415", "S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018"]
"app/**" = ["S310"]  # URL do roteador local, configurável por ROUTER_URL

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.format]
quote-style = "double"
