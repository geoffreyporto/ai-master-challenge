[project]
name = "churn-diag"
version = "1.0.0"
description = "Diagnóstico de churn da RavenStack — G4 AI Master Challenge 001"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "polars>=1.30",
    "numpy>=2.2",
    "scipy>=1.15",
    "scikit-learn>=1.7",
    "matplotlib>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_diag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["I", "F", "E", "W", "PL", "PT", "B", "UP"]
ignore = ["PLR2004", "PLR0913", "PLR0915", "PLC0415"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100  # docstrings pt-BR com tags @spec; o formatador segue 88

[tool.ruff.format]
quote-style = "double"
